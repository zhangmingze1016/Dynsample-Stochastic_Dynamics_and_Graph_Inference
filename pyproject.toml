[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Stochastic_Dynamics_and_Graph_Inference"
version = "0.1.0"
description = "Stochastic dynamics and dynamic relationship inference research tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
plot = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]